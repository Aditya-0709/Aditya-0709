name: Generate Contribution Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution game
        uses: czl9707/gh-space-shooter@main
        with:
          github_user_name: Aditya-0709

      - name: Commit generated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.gif
          git diff --cached --quiet || git commit -m "Update contribution game"
          git push
